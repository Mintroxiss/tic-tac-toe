services:
  postgres:
    image: postgres:16
    container_name: tic-tac-toe-db
    environment:
      POSTGRES_DB: tic-tac-toe
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
