<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Крестики-нолики</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Крестики-нолики</h1>
<h2>ID игры: <span th:text="${gameId}"></span></h2>

<table>
    <!-- Ряд -->
    <tr th:each="row, rowStat : ${field}">
        <!-- Ячейка -->
        <td th:each="cell, colStat : ${row}">
            <button type="button"
                    th:text="${cell}"
                    th:attr="data-row=${rowStat.index},data-col=${colStat.index}"></button>
        </td>
    </tr>
</table>

<p id="status" th:if="${status}" th:text="${status}" style="color:red; margin-top: 20px;"></p>

<script th:inline="javascript">
    /*<![CDATA[*/
    const gameId = /*[[${gameId}]]*/ '';
    const fieldJson = /*[[${fieldJson}]]*/ '[]';
    const field = JSON.parse(fieldJson); // массив массивов строк

    document.querySelectorAll('button[data-row][data-col]').forEach(btn => {
        btn.addEventListener('click', () => {
            const row = parseInt(btn.getAttribute('data-row'));
            const col = parseInt(btn.getAttribute('data-col'));

            // создаём копию поля и обновляем выбранную ячейку
            const newField = field.map(r => [...r]); // глубокое копирование
            newField[row][col] = "X"; // текущий игрок

            fetch('/game/' + gameId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    row: row,
                    col: col,
                    field: newField
                })
            })
            .then(response => response.json())
            .then(gameDto => {
                // обновляем поле на странице
                const rows = document.querySelectorAll('tr');
                gameDto.field.forEach((rowData, r) => {
                    rowData.forEach((cellValue, c) => {
                        const button = rows[r].querySelectorAll('td button')[c];
                        button.textContent = cellValue;
                    });
                });

                // обновляем статус
                const statusEl = document.getElementById('status');
                if (statusEl) statusEl.textContent = gameDto.status;

                // синхронизируем локальное поле
                for (let r = 0; r < field.length; r++) {
                    for (let c = 0; c < field[r].length; c++) {
                        field[r][c] = gameDto.field[r][c];
                    }
                }
            })
            .catch(err => console.error(err));
        });
    });
    /*]]>*/
</script>


</body>
</html>
