<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Ошибка — сессия не найдена</title>
    <link rel="stylesheet" th:href="@{/css/error.css}"/>
</head>
<body>
<div class="card" role="alert" aria-live="polite">
    <h1>Сессия не найдена</h1>

    <p class="lead" th:if="${message}" th:text="${message}"></p>
    <p class="lead" th:unless="${message}">
        Не удалось найти игровую сессию. Возможно, игра была удалена или указан неверный идентификатор.
    </p>

    <p class="meta" th:if="${gameId}">
        Идентификатор сессии: <strong th:text="${gameId}"></strong>
    </p>

    <div class="actions">
        <a th:href="@{/game/new}" class="btn btn-primary" role="button">Создать новую игру</a>
        <a th:href="@{/}" class="btn btn-ghost" role="button">На главную</a>
    </div>

    <p class="meta developer-hint">
        Если это повторяется — проверьте сохранение игры в репозитории и логи сервера.
    </p>
</div>
</body>
</html>
