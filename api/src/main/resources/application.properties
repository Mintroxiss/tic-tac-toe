spring.application.name=tic-tac-toe
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/tic-tac-toe
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Waiting game TTL: 30 minutes, cleanup every 60 seconds
game.waiting.ttl-minutes=30
game.waiting.cleanup-interval-ms=60000
